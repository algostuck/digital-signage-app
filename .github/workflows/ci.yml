name: CI

# Git -> lint -> type check -> unit tests -> build -> integration -> images
#   -> migration + deploy -> health check   (docs/deployment.md)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_to:
        description: "Deploy the built images to"
        type: choice
        options: [none, uat, production]
        default: none

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  backend:
    name: Backend lint + unit tests + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signage
          POSTGRES_PASSWORD: signage
          POSTGRES_DB: signage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check app tests migrations scripts
      - name: Unit + API tests (PostgreSQL)
        run: pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://signage:signage@localhost:5432/signage
      - name: Migration round-trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://signage:signage@localhost:5432/signage

  frontend:
    name: Frontend type check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: frontend/dist
          retention-days: 7

  integration:
    name: Integration audits on the seeded demo data
    needs: [backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signage
          POSTGRES_PASSWORD: signage
          POSTGRES_DB: signage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://signage:signage@localhost:5432/signage
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-boot-checks
      ENVIRONMENT: test
      STORAGE_BACKEND: local
      MEDIA_PROCESSING_INLINE: "true"
      PUBLISHING_INLINE: "true"
      LOG_JSON: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Schema + system seed + demo dataset
        run: |
          alembic upgrade head
          python -m app.seed
          python -m app.demo_seed
      - name: Start the API
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health/ready && break
            sleep 2
          done
      - name: Tenant isolation audit
        run: python scripts/audit_tenant_isolation.py --report isolation.json
      - name: End-to-end journey audit
        run: python scripts/audit_e2e_journey.py --report journey.json
      - name: Subscription & entitlement audit
        run: python scripts/audit_entitlements.py --report entitlements.json
      - name: Performance baseline (informational on shared runners)
        run: python scripts/audit_performance.py --runs 5 --concurrency 4 --report performance.json
        continue-on-error: true
      - name: API log on failure
        if: failure()
        run: tail -n 200 api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-reports
          path: |
            backend/isolation.json
            backend/journey.json
            backend/entitlements.json
            backend/performance.json
            backend/api.log
          retention-days: 14

  images:
    name: Build (and on main/tags push) container images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="${GITHUB_REF_NAME//\//-}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_BASE }}/backend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}/backend:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}/frontend:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Migrate + deploy + health check
    # UAT deploys on every green main build; production only from a
    # version tag or an explicit dispatch, and only after the UAT
    # environment's required reviewers approve (configure both
    # environments and their secrets in the repository settings).
    needs: [integration, images]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.deploy_to != 'none')
    runs-on: ubuntu-latest
    environment:
      name: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.deploy_to == 'production') && 'production' || 'uat' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve target
        id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="${GITHUB_REF_NAME//\//-}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Ship compose file and roll out over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}   # the uat.env / prod.env contents
          IMAGE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST secret not configured for this environment"; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp -r deploy "$DEPLOY_USER@$DEPLOY_HOST:~/signage/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<EOF
            set -euo pipefail
            cd ~/signage
            printf '%s\n' "$DEPLOY_ENV_FILE" > deploy/env/current.env
            sed -i "s#^BACKEND_IMAGE=.*#BACKEND_IMAGE=${IMAGE_BASE}/backend:${IMAGE_TAG}#; s#^FRONTEND_IMAGE=.*#FRONTEND_IMAGE=${IMAGE_BASE}/frontend:${IMAGE_TAG}#" deploy/env/current.env
            docker compose -f deploy/compose.prod.yml --env-file deploy/env/current.env pull
            docker compose -f deploy/compose.prod.yml --env-file deploy/env/current.env run --rm migrate
            docker compose -f deploy/compose.prod.yml --env-file deploy/env/current.env up -d --remove-orphans
          EOF
      - name: Health check
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}   # e.g. https://uat.signage.example.com/api/v1/health/ready
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$HEALTH_URL" | grep -q '"ok"'; then echo "healthy"; exit 0; fi
            sleep 6
          done
          echo "health check failed"; exit 1
