# Portal: static SPA + /api proxy + security headers.
# The API service name (`api`) matches deploy/compose.prod.yml; change the
# upstream if the API runs elsewhere.

upstream signage_api {
    server api:8000;
}

map $sent_http_content_type $asset_cache {
    default                    "no-cache";
    ~*image/                   "public, max-age=604800, immutable";
    ~*font/                    "public, max-age=604800, immutable";
    ~*javascript               "public, max-age=31536000, immutable";
    ~*text/css                 "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets can be cached forever; index.html never.
    add_header Cache-Control $asset_cache always;

    # Security headers for the HTML/JS the API never serves.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Scripts only from this origin; images also from the map tiles and
    # media/CDN (add the CDN origin to img-src/media-src when CDN_URL is
    # set); the API is same-origin through the proxy below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 600m;   # uploads go through /api/v1/storage/local in local-storage mode

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://signage_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_request_buffering off;  # stream large media uploads
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
